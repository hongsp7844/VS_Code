[Rainmeter]
Update=1000
DynamicWindowSize=1
AccurateText=1

[Variables]
@Include=#@#Setting.inc

[Background]
Meter=Shape
Shape=Rectangle 0,0,470,70,16 | Fill Color #BgColor# | StrokeWidth 0

[Title]
Meter=String
Text=My Launcher
X=20
Y=22
FontSize=18
FontColor=#FontColor#
AntiAlias=1

[MeasureGroup1]
Measure=Calc
Formula=(#CurrentGroup# = 1 ? 255 : 170)
DynamicVariables=1

[Group1Button]
Meter=String
Text=Group 1
X=280
Y=22
FontSize=14
FontColor=[&MeasureGroup1],[&MeasureGroup1],[&MeasureGroup1]
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=[!SetVariable CurrentGroup 1][!UpdateMeasure MeasureGroup1][!UpdateMeasure MeasureGroup2][!UpdateMeter Group1Button][!UpdateMeter Group2Button][!Redraw][!DeactivateConfig "Hongskin\Modules" "Group2.ini"][!ActivateConfig "Hongskin\Modules" "Group1.ini"]


[MeasureGroup2]
Measure=Calc
Formula=(#CurrentGroup# = 2 ? 255 : 170)
DynamicVariables=1

[Group2Button]
Meter=String
Text=Group 2
X=360
Y=22
FontSize=14
FontColor=[&MeasureGroup2],[&MeasureGroup2],[&MeasureGroup2]
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=[!SetVariable CurrentGroup 2][!UpdateMeasure MeasureGroup1][!UpdateMeasure MeasureGroup2][!UpdateMeter Group1Button][!UpdateMeter Group2Button][!Redraw][!DeactivateConfig "Hongskin\Modules" "Group1.ini"][!ActivateConfig "Hongskin\Modules" "Group2.ini"]