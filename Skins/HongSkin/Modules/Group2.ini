[Rainmeter]
Update=1000
DynamicWindowSize=1
AccurateText=1

[Variables]
@Include=#@#Setting.inc

; -------------------------
; Styles
; -------------------------

[StyleIcon]
W=56
H=56

[StyleLabel]
FontSize=10
FontColor=#FontColor#
AntiAlias=1
StringAlign=Center

[StyleHover]
Shape=Rectangle 0,0,100,90,12 | Fill Color #HoverColor# | StrokeWidth 0
Hidden=1

; -------------------------
; Background
; -------------------------

[Background]
Meter=Shape
Shape=Rectangle 0,0,420,260,16 | Fill Color #BgColor# | StrokeWidth 0

; =========================================================
; Launcher 1
; =========================================================

[Hover1]
Meter=Shape
MeterStyle=StyleHover
X=13
Y=18

[Icon1]
Meter=Image
MeterStyle=StyleIcon
ImageName=#@#Images\#Group2Launcher1Icon#
X=35
Y=30
LeftMouseUpAction=#Group2Launcher1Action#
MouseOverAction=[!ShowMeter Hover1][!UpdateMeter Hover1][!Redraw]
MouseLeaveAction=[!HideMeter Hover1][!UpdateMeter Hover1][!Redraw]

[Label1]
Meter=String
MeterStyle=StyleLabel
Text=#Group2Launcher1Name#
X=63
Y=92

