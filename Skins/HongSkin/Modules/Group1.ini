[Rainmeter]
Update=16
DynamicWindowSize=1
AccurateText=1

[Variables]
@Include=#@#Setting.inc

; =========================================================
; Measures
; =========================================================

[MeasureGroup1]
Measure=Calc
Formula=(#CurrentGroup# = 1 ? 255 : 170)
DynamicVariables=1

[MeasureGroup2]
Measure=Calc
Formula=(#CurrentGroup# = 2 ? 255 : 170)
DynamicVariables=1

; -------------------------
; Icon 1 Animation
; -------------------------

[MeasureIcon1Size]
Measure=Calc
Formula=(#Icon1Current# + ((#Icon1Target# - #Icon1Current#) / 5))
DynamicVariables=1
IfCondition=1
IfTrueAction=[!SetVariable Icon1Current [MeasureIcon1Size]]

[MeasureIcon1Offset]
Measure=Calc
Formula=([MeasureIcon1Size] - 56) / 2
DynamicVariables=1

; =========================================================
; Styles
; =========================================================

[StyleIcon]
DynamicVariables=1

[StyleLabel]
FontSize=10
FontColor=#FontColor#
AntiAlias=1
StringAlign=Center

[StyleHover]
Shape=Rectangle 0,0,100,90,12 | Fill Color #HoverColor# | StrokeWidth 0
Hidden=1

; =========================================================
; Background
; =========================================================

[Background]
Meter=Shape
Shape=Rectangle 0,0,420,260,16 | Fill Color #BgColor# | StrokeWidth 0

; =========================================================
; Launcher 1
; =========================================================

[Button1]
Meter=Shape
Shape=Rectangle 0,0,100,90,12 | Fill Color 255,255,255,1 | StrokeWidth 0
X=13
Y=18
MouseOverAction=[!ShowMeter Hover1][!SetVariable Icon1Target 60]
MouseLeaveAction=[!HideMeter Hover1][!SetVariable Icon1Target 56]
LeftMouseUpAction=#Group1Launcher1Action#

[Hover1]
Meter=Shape
MeterStyle=StyleHover
X=13
Y=18

[Icon1]
Meter=Image
MeterStyle=StyleIcon
ImageName=#@#Images\#Group1Launcher1Icon#
X=(#Icon1BaseX# - [MeasureIcon1Offset])
Y=(#Icon1BaseY# - [MeasureIcon1Offset])
W=[MeasureIcon1Size]
H=[MeasureIcon1Size]
DynamicVariables=1

[Label1]
Meter=String
MeterStyle=StyleLabel
Text=#Group1Launcher1Name#
X=63
Y=92

