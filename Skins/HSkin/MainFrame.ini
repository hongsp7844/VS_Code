[Shutdown]
Meter=Image
ImageName=#@#\Images\Icons\Navbar\shutdownw
X=1780
Y=#TopBarYPos#+15
LeftMouseUpAction=%systemroot%\system32\shutdown.exe -s -t 00
MouseOverAction=[!CommandMeasure SD_MeasureSize "Stop 2"][!CommandMeasure SD_MeasureSize "Execute 1"][!CommandMeasure SD_MeasureSizeDownText "Stop 1"][!CommandMeasure SD_MeasureSizeUpText "Execute 1"]
MouseLeaveAction=[!CommandMeasure SD_MeasureSize "Stop 1"][!CommandMeasure SD_MeasureSize "Execute 2"][!CommandMeasure SD_MeasureSizeUpText "Stop 1"][!CommandMeasure SD_MeasureSizeDownText "Execute 1"]
AntiAlias=1
PreserveAspectRatio=1
Group=Icons
SolidColor=0,0,0,1
W=26


[SD_MeasureSize]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat SizeUp,#IconTimeWaiting#,4
SizeUp=[!SetOption Shutdown W "(Clamp([Shutdown:W]+3,26,65))"][!SetOption Shutdown Y "(Clamp([Shutdown:Y]-2,0,(#TopBarYPos#)+15))"][!SetOption Shutdown X "(Clamp([Shutdown:X]-2,0,1780))"][!UpdateMeterGroup Icons][!Redraw]
ActionList2=Repeat SizeDn,#IconTimeWaiting#,4
SizeDn=[!SetOption Shutdown W "(Clamp([Shutdown:W]-3,26,65))"][!SetOption Shutdown Y "(Clamp([Shutdown:Y]+2,0,(#TopBarYPos#)+15))"][!SetOption Shutdown X "(Clamp([Shutdown:X]+2,0,1780))"][!UpdateMeterGroup Icons][!Redraw]
IgnoreWarnings=1
DynamicVariables=1

[ShutdownText]
Meter=String
StringAlign=CenterCenter
FontFace=#LauncherFont#
FontSize=#SD_Size#
FontColor=255,255,255,255
StringStyle=BOLD
X=1790
Y=#TopBarYPos#
Text="Shut Down"
AntiAlias=1
DynamicVariables=1
H=10
W=70

[SD_MeasureSizeUpText]
Measure=Plugin
Plugin=ActionTimer
Group=Sizers
ActionList1=ChangeSizeStart|Wait #TextTimeWaiting2#|Repeat ChangeSizeCalc,#TextTimeWaiting#,11
ChangeSizeStart=[!SetVariable SD_Size "#SD_Size#"][!UpdateMeasureGroup Sizers][!UpdateMeter ShutdownText][!Redraw]
ChangeSizeCalc=[!SetVariable SD_Size "(Clamp(#SD_Size#+1,0,20))"][!UpdateMeasureGroup Sizers][!UpdateMeter ShutdownText][!Redraw]
DynamicVariables=1

[SD_MeasureSizeDownText]
Measure=Plugin
Plugin=ActionTimer
Group=Sizers
ActionList1=ChangeSizeStart|Wait #TextTimeWaiting#|Repeat ChangeSizeCalc,#TextTimeWaiting#,11
ChangeSizeStart=[!SetVariable SD_Size "#SD_Size#"][!UpdateMeasureGroup Sizers][!UpdateMeter ShutdownText][!Redraw]
ChangeSizeCalc=[!SetVariable SD_Size "(Clamp(#SD_Size#-1,0,20))"][!UpdateMeasureGroup Sizers][!UpdateMeter ShutdownText][!Redraw]
DynamicVariables=1


[Restart]
Meter=Image
ImageName=#@#\Images\Icons\Navbar\restartw.png
X=1720
Y=#TopBarYPos#+15
LeftMouseUpAction=!Execute [%windir%\System32\shutdown.exe -r -t 00]
MouseOverAction=[!CommandMeasure RS_MeasureSize "Stop 2"][!CommandMeasure RS_MeasureSize "Execute 1"][!CommandMeasure RS_MeasureSizeDownText "Stop 1"][!CommandMeasure RS_MeasureSizeUpText "Execute 1"]
MouseLeaveAction=[!CommandMeasure RS_MeasureSize "Stop 1"][!CommandMeasure RS_MeasureSize "Execute 2"][!CommandMeasure RS_MeasureSizeUpText "Stop 1"][!CommandMeasure RS_MeasureSizeDownText "Execute 1"]
