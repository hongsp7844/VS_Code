ActionList1=ChangeSizeStart|Wait #TextTimeWaiting2#|Repeat ChangeSizeCalc,#TextTimeWaiting#,11
ChangeSizeStart=[!SetVariable RS_Size "#RS_Size#"][!UpdateMeasureGroup Sizers][!UpdateMeter Restart][!Redraw]
ChangeSizeCalc=[!SetVariable RS_Size "(Clamp(#RS_Size#+1,0,20))"][!UpdateMeasureGroup Sizers][!UpdateMeter Restart][!Redraw]
