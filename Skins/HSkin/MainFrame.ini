;=========================================================================================================================
;============================================         Dock         =======================================================
; 모듈 하단 바
;=========================================================================================================================


[MeasureHours]
Measure=Time
Format="%#Format#"

[MeasureMinutes]
Measure=Time
Format="%M"

[MeasureAmPm]
Measure=Time
Format="%p"

[MeasureDay]
Measure=Time
Format=%A
Substitute=#Date#

[MeasureDate]
Measure=Time
Format=%d %B,%Y.
Substitute=#Date#

