;-------------------------------------------------------------
[Background]
Meter=IMAGE
X=85
Y=900
W=1750
H=80
SolidColor=0, 0, 0, 100

[Meter12h]
Meter=String
MeasureName=MeasureHours
MeasureName2=MeasureMinutes
MeasureName3=MeasureAmPm
StringAlign=Center
StringCase=Upper
FontFace=Futurist Fixed-width
FontColor=255,255,255
FontSize=(85*#Scale#)
X=230
Y=914
Text="%1:%2|%3"
InlineSetting=CharacterSpacing | 0 | 0
AntiAlias=1

[MeterDate]
