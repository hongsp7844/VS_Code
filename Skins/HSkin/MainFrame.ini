[Rainmeter]
Update=20
ContextTitle=Launcher Settings
ContextAction=["#@#Setting.inc"]
OnRefreshAction=!Execute [!CommandMeasure Blur EnableBlur][!Zpos -2][!Delay 500][!EnableMeasure BaseAnimation][!Delay 500][!ActivateConfig "HSKin\Modules" "LauncherGroup1.ini"][!Delay 500][!ShowMeter Deactivitor]
SkinWidth=#SCREENAREAWIDTH#
SkinHeight=#SCREENAREAHEIGHT#
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1

[Metadata]
Name=HSkin Launcher v3
Author=u/TheProtagonists
Information=The hidden part of the launcher. !Don't load this, load SPECTRUM 3 instead!'
License=Creative Commons BY-NC-SA 4.0
Version=3.0

[Variables]

@Include="#@#Setting.inc"
@Include2="#@#Variable.inc"
Scale=0.2

[BaseAnimation]
Measure=Calc 
Disabled=1
Formula=(BaseAnimation-((BaseAnimation-#SCREENAREAWIDTH#)/#AnimationFactor#))
IfEqualValue=#SCREENAREAWIDTH#
IfEqualAction=[!PauseMeasure #CURRENTSECTION#]
DynamicVariables=1
UpdateDivider=1

[Deactivitor]
Meter=image
W=((#SCREENAREAWIDTH#)*0.8)
H=2
X=((#SCREENAREAWIDTH#)*0.1)
Y=0
SolidColor=255,255,255,1
UpdateDivider=-1
MouseOverAction=#UnloadSkin#
Hidden=1

[SpectrumBar]
Meter=Shape
ImageName=#@#Images\ColorBars\#ColorBar#
Shape=Rectangle #XPos10#, ((#SCREENAREAHEIGHT#)*0.2), (Clamp(([BaseAnimation]*1.5),0,(((#SCREENAREAWIDTH#)*0.9)+20))), 8 | Fill LinearGradient BarGrad | StrokeWidth 0
BarGrad=#BarGradient#
DynamicVariables=1

