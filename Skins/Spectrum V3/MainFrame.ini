[Rainmeter]
Update=16
ContextTitle=Launcher Settings
ContextAction=["#@#settings.inc"]
OnRefreshAction=!Execute [!CommandMeasure Blur EnableBlur][!Zpos -2][!Delay 500][!EnableMeasure BaseAnimation][!Delay 1000][!ActivateConfig "Spectrum V3\Modules" "LauncherGroup1.ini"][!Delay 500][!ShowMeter Deactivitor]
SkinWidth=#SCREENAREAWIDTH#
SkinHeight=#SCREENAREAHEIGHT#

[Variables]

@Include="#@#settings.inc"
@Include2="#@#variables.inc"
@Include3="#@#measures.inc"

[BaseAnimation]
Measure=Calc 
Disabled=1
Formula=(BaseAnimation-((BaseAnimation-#SCREENAREAWIDTH#)/#AnimationFactor#))
IfEqualValue=#SCREENAREAWIDTH#
IfEqualAction=[!PauseMeasure #CURRENTSECTION#]
DynamicVariables=1
UpdateDivider=1

[Deactivitor]
Meter=image
W=((#SCREENAREAWIDTH#)*0.8)
H=2
X=((#SCREENAREAWIDTH#)*0.1)
Y=0
SolidColor=255,255,255,1
UpdateDivider=-1
MouseOverAction=#UnloadSkin#
Hidden=1

; 작대기

[SpectrumBar]
Meter=Shape
ImageName=#@#Images\ColorBars\#ColorBar#
Shape=Rectangle #XPos10#, ((#SCREENAREAHEIGHT#)*0.7105), (Clamp(([BaseAnimation]*1.5),0,(((#SCREENAREAWIDTH#)*0.9)+20))), 7 | Fill LinearGradient BarGrad | StrokeWidth 0
BarGrad=#BarGradient#
DynamicVariables=1

;=========================================================================================================================

;NavBar Section===========================================================================================================

;=========================================================================================================================

[NavButton1]
Meter=Image
X=#XPos10#
Y=#BottomBarYPos#-33
W=(Clamp(([BaseAnimation]/2),0,#NavButtonWidth#))
H=#BarHeight#
SolidColor=0,0,0,128
DynamicVariables=1
LeftMouseUpAction=[!ActivateConfig "Spectrum V3\Modules" "LauncherGroup1.ini"]
MouseOverAction=[!SetOption #CURRENTSECTION# SolidColor "0,0,0,192"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# SolidColor "0,0,0,128"][!UpdateMeter #CURRENTSECTION#][!Redraw]

[Button1Icon]
Meter=Image
ImageName=#@#Images\Icons\Navbar\#Group1BarIcon#
X=r
Y=r
W=#BarHeight#
H=#BarHeight#
ImageAlpha=(Clamp(([BaseAnimation]/2),0,255))
DynamicVariables=1

[Button1Text]
Meter=String
X=(#NavButtonWidth#-#BarHeight#)R
Y=#NavFontYPos#*3.2+12
W=(#NavButtonWidth#-#BarHeight#)
H=#BarHeight#
FontFace=#BarFont#
FontSize=#BarFontSize#
FontColor=255,255,255,(Clamp(([BaseAnimation]/2),0,255))
Text=#Group1BarName#
StringAlign=Right
DynamicVariables=1
AntiAlias=1

